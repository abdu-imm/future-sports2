<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my bag</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./cart1.css">

</head>
<body>
    <section class="py-5 bg-light">
  <div class="container">

    <h2 class="fw-bold mb-4">Your Cart</h2>

    <div class="row g-4">

      <!-- Cart Items -->
      <div class="col-lg-8">

        <div class="card border-0 shadow-sm mb-3 p-3">
          <div class="row align-items-center">

            <div class="col-3">
              <img src="./football.png"
                   class="img-fluid cart-img"
                   alt="Football">
            </div>

            <div class="col-5">
              <h5 class="mb-1">Pro Football</h5>
              <p class="text-muted mb-1">₹899</p>
              <small>Size: 5</small>
            </div>

            <div class="col-2">
              <input type="number"
                     class="form-control"
                     value="1"
                     min="1">
            </div>

            <div class="col-2 text-end">
              <button class="btn btn-outline-danger btn-sm">
                Remove
              </button>
            </div>

          </div>
        </div>

        <div class="card border-0 shadow-sm p-3">
          <div class="row align-items-center">

            <div class="col-3">
              <img src="./adidas-shoes.png"
                   class="img-fluid cart-img"
                   alt="Football Shoes">
            </div>

            <div class="col-5">
              <h5 class="mb-1">Football Shoes</h5>
              <p class="text-muted mb-1">₹1,499</p>
              <small>Size: 7 UK</small>
            </div>

            <div class="col-2">
              <input type="number"
                     class="form-control"
                     value="1"
                     min="1">
            </div>

            <div class="col-2 text-end">
              <button class="btn btn-outline-danger btn-sm">
                Remove
              </button>
            </div>

          </div>
        </div>

      </div>

      <!-- Order Summary -->
      <div class="col-lg-4">

        <div class="card border-0 shadow-sm p-4 cart-summary">

          <h4 class="fw-bold mb-4">Order Summary</h4>

          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <strong>₹2,398</strong>
          </div>

          <div class="d-flex justify-content-between mb-2">
            <span>Delivery</span>
            <strong class="text-success">FREE</strong>
          </div>

          <hr>

          <div class="d-flex justify-content-between fs-5 mb-4">
            <strong>Total</strong>
            <strong>₹2,398</strong>
          </div>

          <button class="btn btn-success w-100 py-2">
            Proceed to Checkout
          </button>

        </div>

      </div>

    </div>
  </div>
</section>
    
</body>
</html>
